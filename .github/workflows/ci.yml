# Pull request CI (ADR 0004): format, lint, build and tests, on Linux only.
# Windows builds are reserved for the deployment workflows.
name: CI

on:
  pull_request:
    branches: [dev, main]
  # Also after each merge: caches saved from a pull request are only visible to that
  # pull request, while caches saved on dev and main are shared with every pull request.
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # clang-tidy major version: the one Ubuntu 24.04 ships, as in the dev container
  # (.devcontainer/Dockerfile). clang-format is pinned in .pre-commit-config.yaml.
  LLVM_VERSION: "18"
  PRE_COMMIT_VERSION: "4.6.2"

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit message check needs the pull request history

      # Only Qt, for qmlformat.
      - uses: ./.github/actions/setup-build-deps
        with:
          full: "false"

      - name: Restore pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ env.PRE_COMMIT_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The same hooks as locally (.pre-commit-config.yaml): formatting and file hygiene.
      - name: Run pre-commit hooks
        run: |
          pipx install "pre-commit==$PRE_COMMIT_VERSION"
          pre-commit run --all-files --show-diff-on-failure

      # Only on pull requests to dev: commits reaching main were checked when they
      # entered dev, and the squash commits GitHub creates there are authored by
      # the merging account (noreply address), so their sign-offs do not match.
      - name: Check commit messages
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_commit_message.py --range "$BASE_SHA..$HEAD_SHA"

  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-build-deps

      - name: Configure
        run: cmake --preset debug -DMISIGN_WARNINGS_AS_ERRORS=ON -DMISIGN_REQUIRE_TEST_TOOLS=ON

      - name: Build
        run: cmake --build --preset debug

      # After the build, so the files generated by moc and qmltc exist.
      - name: Lint C++
        run: |
          sudo apt-get install -y --no-install-recommends "clang-tidy-$LLVM_VERSION"
          git ls-files 'src/*.cpp' 'tests/*.cpp' | xargs "run-clang-tidy-$LLVM_VERSION" -p build/debug -quiet

      - name: Lint QML
        run: cmake --build --preset debug --target all_qmllint

      - name: Unit tests
        run: ctest --preset debug -L unit

      - name: Integration tests
        run: ctest --preset debug -L integration
