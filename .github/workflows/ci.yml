# Pull request CI (ADR 0004): format, lint, build and tests, on Linux only.
# Windows builds are reserved for the deployment workflows.
name: CI

on:
  pull_request:
    branches: [dev, main]
  # Also after each merge: caches saved from a pull request are only visible to that
  # pull request, while caches saved on dev and main are shared with every pull request.
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: |
          if [ ! -f .clang-format ]; then
            echo "::notice::No .clang-format yet (PHY-81): formatting is not checked."
            exit 0
          fi
          git ls-files '*.cpp' '*.h' | xargs --no-run-if-empty clang-format --dry-run --Werror

  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-deps

      - name: Configure
        run: cmake --preset debug -DMISIGN_WARNINGS_AS_ERRORS=ON -DMISIGN_REQUIRE_TEST_TOOLS=ON

      - name: Build
        run: cmake --build --preset debug

      # After the build, so the files generated by moc and qmltc exist.
      - name: Lint
        run: |
          if [ ! -f .clang-tidy ]; then
            echo "::notice::No .clang-tidy yet (PHY-81): the code is not linted."
            exit 0
          fi
          git ls-files '*.cpp' | xargs --no-run-if-empty run-clang-tidy -p build/debug -quiet

      - name: Unit tests
        run: ctest --preset debug -L unit

      - name: Integration tests
        run: ctest --preset debug -L integration
