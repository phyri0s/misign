# Code coverage report (ADR 0009), read by gcovr from the repository root:
#   gcovr build/coverage --html-details build/coverage/report/index.html
# Only the application code under src/ is reported: tests/, the files generated
# by moc, qmltc and rcc (in the build tree) and third-party code are left out.
root = .
filter = src/
exclude = .*/moc_.*
exclude = .*/qrc_.*
exclude = .*_qmltc.*
exclude = .*_autogen/.*

# Branches added by the compiler for exceptions and unreachable code are not
# decisions of the source code: counting them makes branch coverage meaningless.
exclude-throw-branches = yes
exclude-unreachable-branches = yes

print-summary = yes
